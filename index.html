<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Жижигхэн захиалга</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff9fa,#171316);--panel:light-dark(#ffffff,#211b1f);--text:light-dark(#30242a,#f8f0f3);--muted:light-dark(#897780,#b9aab1);--line:light-dark(#eee1e6,#40333a);--accent:light-dark(#a44c6d,#e5a0ba);--soft:light-dark(#fff0f5,#34232b)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#app{min-height:100vh;width:100%;background:var(--bg);padding:25px 16px 48px}.wrap{max-width:650px;margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.brand{font-size:12px;letter-spacing:.16em;font-weight:800}.pill{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:30px;padding:7px 11px}.hero{padding:10px 0 26px}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:var(--accent);font-weight:800}.hero h1{font-size:clamp(34px,8vw,52px);line-height:1.06;letter-spacing:-.055em;margin:12px 0}.hero p,.sub{color:var(--muted);font-size:14px;line-height:1.65}.hero p{max-width:420px;margin:0}.progress{display:flex;gap:6px;margin:0 0 18px}.progress span{height:3px;border-radius:9px;background:var(--line);flex:1}.progress span.on{background:var(--accent)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:clamp(18px,4vw,28px)}.stepmeta{font-size:10px;color:var(--accent);font-weight:800;letter-spacing:.14em}.panel h2{font-size:24px;letter-spacing:-.035em;margin:10px 0 5px}.sub{margin:0 0 22px}.field{display:grid;gap:8px;margin:18px 0}.field label{font-size:13px;font-weight:700}.input{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit;outline:none}.input:focus{border-color:var(--accent)}.grid{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:9px}.choice{display:flex;align-items:center;gap:13px;width:100%;text-align:left;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--bg);color:var(--text);cursor:pointer;min-height:66px}.choice .emoji{font-size:24px;width:32px;text-align:center}.choice strong{font-size:14px;font-weight:650}.choice.selected{border-color:var(--accent);background:var(--soft)}.checks{display:grid;gap:9px}.check{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:13px;padding:13px;background:var(--bg);cursor:pointer;font-size:14px}.check:has(input:checked){border-color:var(--accent);background:var(--soft)}.check input{accent-color:var(--accent);width:17px;height:17px}.hint{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}.footer{display:flex;gap:10px;margin-top:24px}.btn{border:0;border-radius:12px;padding:13px 17px;font:inherit;font-size:13px;font-weight:750;cursor:pointer}.primary{background:var(--accent);color:light-dark(#fff,#27171e);flex:1}.secondary{background:transparent;border:1px solid var(--line);color:var(--text)}.summary{display:grid}.sumrow{display:flex;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);font-size:13px}.sumrow span:first-child{color:var(--muted)}.sumrow strong{text-align:right;max-width:65%;line-height:1.5}.total{margin-top:18px;padding:17px;border-radius:14px;background:var(--soft);display:flex;align-items:center;justify-content:space-between;gap:12px}.total b{font-size:25px;color:var(--accent)}.notice{font-size:12px;color:var(--muted);line-height:1.6;margin-top:14px}.hidden{display:none!important}.success{text-align:center;padding:18px 4px}.success .big{font-size:44px;color:var(--accent)}.success h2{font-size:27px}.adminbox{margin-top:24px;border-top:1px solid var(--line);padding-top:17px}.adminbox summary{cursor:pointer;font-size:12px;color:var(--muted)}.ordercard{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:13px;font-size:12px;line-height:1.7;white-space:pre-wrap}.toast{font-size:12px;color:var(--accent);min-height:18px;margin-top:10px}@media(min-width:520px){.grid.meals{grid-template-columns:1fr}.checks.drinks{grid-template-columns:1fr 1fr}}@media(max-width:400px){#app{padding:18px 12px 32px}.panel{padding:17px}.footer .btn{padding:12px 13px}}
</style>
</head>
<body><main id="app"><div class="wrap">
<header class="top"><div class="brand">♡ ЖИЖИГХЭН ЗАХИАЛГА</div><div class="pill">зөвхөн чамд</div></header>
<section class="hero"><div class="eyebrow">A little thing made with care</div><h1>Юу идмээр байна? ♡</h1><p>Сонголтоо хийгээрэй. Бусдыг нь би бэлдээд очно.</p></section>
<div class="progress" id="progress"><span class="on"></span><span></span><span></span><span></span></div>
<section class="panel" id="panel"></section>
<details class="adminbox"><summary>♡ Захиалгууд</summary><p class="hint">Зөвхөн энэ төхөөрөмж дээр хадгалагдсан захиалгууд харагдана.</p><div id="orders"></div><button class="btn secondary" id="clearOrders" style="margin-top:12px">Захиалгууд арилгах</button></details>
</div></main>
<script>
const meals=[{id:'riceSoup',emoji:'🍲',name:'Борцтой будаатай шөл'},{id:'noodleSoup',emoji:'🥣',name:'Борцтой гурилтай шөл'},{id:'friedRice',emoji:'🍛',name:'Борцтой будаатай хуурга'}];
const drinks=[{id:'cola',emoji:'🥤',name:'Coca-Cola'},{id:'fuzetea',emoji:'🧋',name:'Fuze Tea'},{id:'minuteMaid',emoji:'🍊',name:'Minute Maid жүржтэй'}];
const desserts=[{id:'cake',emoji:'🍰',name:'Cake'},{id:'icecream',emoji:'🍦',name:'Ice cream'},{id:'custom',emoji:'♡',name:'Хүссэн зүйлээ бичих'}];
let state={step:0,name:'',meal:'',drinks:[],dessert:'',customDessert:''};
const panel=document.getElementById('panel');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function progress(){document.querySelectorAll('#progress span').forEach((s,i)=>s.classList.toggle('on',i<=Math.min(state.step,3)));}
function choices(items,selected){return `<div class="grid meals">${items.map(x=>`<button type="button" class="choice ${selected===x.id?'selected':''}" data-choice="${x.id}"><span class="emoji">${x.emoji}</span><strong>${x.name}</strong></button>`).join('')}</div>`}
function buttons(back=true,next='Үргэлжлүүлэх'){return `<div class="footer">${back?'<button class="btn secondary" data-back>Буцах</button>':''}<button class="btn primary" data-next>${next} →</button></div>`}
function drinkChoices(){return `<div class="checks drinks">${drinks.map(x=>`<label class="check"><input type="checkbox" value="${x.id}" data-drink ${state.drinks.includes(x.id)?'checked':''}><span>${x.emoji} ${x.name}</span></label>`).join('')}</div>`}
function render(){progress();let html='';
if(state.step===0){html=`<div class="stepmeta">01 / 04</div><h2>Эхлээд нэрээ бичээрэй</h2><p class="sub">Захиалгыг чинь хэн өгснийг мэдэхийн тулд ♡</p><div class="field"><label for="name">Нэр</label><input class="input" id="name" placeholder="Нэрээ бичээрэй..." value="${esc(state.name)}" maxlength="50" autocomplete="name"></div>${buttons(false)}`}
else if(state.step===1){html=`<div class="stepmeta">02 / 04</div><h2>Хоолоо сонгоорой 🍲</h2><p class="sub">Гурван сонголтоос нэгийг нь сонгоно.</p>${choices(meals,state.meal)}<div class="hint">Сонгосон хоол: хамтдаа +15 минут ♡</div>${buttons()}`}
else if(state.step===2){html=`<div class="stepmeta">03 / 04</div><h2>Юу уух вэ? 🥤</h2><p class="sub">Хүссэнээрээ олон сонгож болно.</p>${drinkChoices()}<div class="hint">Сонгосон уух зүйл бүр хамтдаа +5 минут.</div>${buttons()}`}
else if(state.step===3){html=`<div class="stepmeta">04 / 04</div><h2>Амттангаа сонгоорой ♡</h2><p class="sub">Амттаны сонголтоо хийгээд захиалгаа явуулаарай.</p>${choices(desserts,state.dessert)}${state.dessert==='custom'?`<div class="field"><label for="customDessert">Ямар амттан хүсэж байна?</label><input class="input" id="customDessert" placeholder="Хүссэн зүйлээ бичээрэй..." value="${esc(state.customDessert)}" maxlength="100"></div>`:''}<div class="hint">Амттан: хамтдаа +5 минут ♡</div>${buttons(true,'Төлбөрийн нөхцөл харах')}`}
else if(state.step===4){let extra=15+state.drinks.length*5+5;let meal=meals.find(x=>x.id===state.meal);let drinkNames=state.drinks.map(id=>drinks.find(x=>x.id===id)?.name);let dessert=state.dessert==='custom'?state.customDessert:desserts.find(x=>x.id===state.dessert)?.name;html=`<div class="stepmeta">ТӨГСГӨЛ</div><h2>Төлбөрийн нөхцөл ♡</h2><p class="sub">Мөнгө биш шүү. Чамтай хамт байх нэмэлт хугацаа л юм.</p><div class="summary"><div class="sumrow"><span>Нэр</span><strong>${esc(state.name)}</strong></div><div class="sumrow"><span>Хоол · +15 мин</span><strong>${esc(meal?.name||'—')}</strong></div><div class="sumrow"><span>Уух зүйл · +${state.drinks.length*5} мин</span><strong>${esc(drinkNames.join(', ')||'Сонгоогүй')}</strong></div><div class="sumrow"><span>Dessert · +5 мин</span><strong>${esc(dessert||'—')}</strong></div></div><div class="total"><div><div class="eyebrow">НЭМЭЛТ ХУГАЦАА</div><div style="font-size:12px;color:var(--muted);margin-top:5px">Чамтай илүү удаан байна ♡</div></div><b>+${extra} мин</b></div><p class="notice">Хоол +15 минут · Уух зүйл бүр +5 минут · Dessert +5 минут.</p>${buttons(true,'♡ Захиалга илгээх')}`}
else{html=`<div class="success"><div class="big">♡</div><div class="eyebrow">ЗАХИАЛГА БЭЛЭН</div><h2>Баярлалаа, ${esc(state.name)}.</h2><p class="sub">Сонголт чинь хадгалагдлаа. Одоо надад илгээгээрэй ♡</p><button class="btn primary" id="share">Захиалгаа илгээх ↗</button><div class="toast" id="toast"></div><div class="footer"><button class="btn secondary" id="restart">Дахин эхлэх</button></div></div>`}
panel.innerHTML=html;
panel.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let id=b.dataset.choice;if(state.step===1)state.meal=id;if(state.step===3)state.dessert=id;render()});
panel.querySelectorAll('[data-drink]').forEach(c=>c.onchange=()=>{state.drinks=[...panel.querySelectorAll('[data-drink]:checked')].map(x=>x.value)});
let ni=panel.querySelector('#name');if(ni)ni.oninput=()=>state.name=ni.value;let cd=panel.querySelector('#customDessert');if(cd)cd.oninput=()=>state.customDessert=cd.value;
let next=panel.querySelector('[data-next]');if(next)next.onclick=()=>{if(state.step===0&&!state.name.trim()){alert('Нэрээ бичээрэй ♡');return}if(state.step===1&&!state.meal){alert('Хоолоо сонгоорой ♡');return}if(state.step===3&&(!state.dessert||(state.dessert==='custom'&&!state.customDessert.trim()))){alert('Амттанаа сонгоод бичээрэй ♡');return}if(state.step===4){saveOrder();state.step=5}else state.step++;render()};
let back=panel.querySelector('[data-back]');if(back)back.onclick=()=>{state.step--;render()};let share=panel.querySelector('#share');if(share)share.onclick=shareOrder;let restart=panel.querySelector('#restart');if(restart)restart.onclick=()=>{state={step:0,name:'',meal:'',drinks:[],dessert:'',customDessert:''};render()};}
function orderText(){let meal=meals.find(x=>x.id===state.meal)?.name;let drinkNames=state.drinks.map(id=>drinks.find(x=>x.id===id)?.name);let dessert=state.dessert==='custom'?state.customDessert:desserts.find(x=>x.id===state.dessert)?.name;let extra=15+state.drinks.length*5+5;return `♡ ЖИЖИГХЭН ЗАХИАЛГА\nНэр: ${state.name}\nХоол: ${meal} (+15 минут)\nУух зүйл: ${drinkNames.join(', ')||'Сонгоогүй'} (+${state.drinks.length*5} минут)\nDessert: ${dessert} (+5 минут)\nНийт нэмэлт хугацаа: +${extra} минут\n\nБусдыг нь би бэлдээд очно. ♡`}
function saveOrder(){let orders=JSON.parse(localStorage.getItem('dateNightOrders')||'[]');orders.unshift({text:orderText(),at:new Date().toLocaleString('mn-MN')});localStorage.setItem('dateNightOrders',JSON.stringify(orders));drawOrders()}
function drawOrders(){let el=document.getElementById('orders'),orders=JSON.parse(localStorage.getItem('dateNightOrders')||'[]');el.innerHTML=orders.length?orders.map(o=>`<div class="ordercard"><div style="color:var(--muted);margin-bottom:7px">${esc(o.at)}</div>${esc(o.text)}</div>`).join(''):'<div class="hint">Одоогоор захиалга алга.</div>'}
async function shareOrder(){let txt=orderText(),toast=document.getElementById('toast');try{if(navigator.share){await navigator.share({title:'Жижигхэн захиалга',text:txt})}else if(navigator.clipboard){await navigator.clipboard.writeText(txt);toast.textContent='Захиалгын текст хууллаа. Чат руу paste хийгээд илгээгээрэй.'}else{window.prompt('Захиалгын текстээ хуулна уу:',txt)}}catch(e){toast.textContent='Хуваалцах цонх хаагдсан байна.'}}
document.getElementById('clearOrders').onclick=()=>{if(confirm('Энэ төхөөрөмж дээрх захиалгуудыг арилгах уу?')){localStorage.removeItem('dateNightOrders');drawOrders()}};render();drawOrders();
</script></body></html>
